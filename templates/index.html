{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1>My Tasks</h1>
    <a href="{{ url_for('new_task') }}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> New Task
    </a>
</div>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Filter Tasks</h5>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="statusFilter">
                        <option value="all">All Tasks</option>
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select class="form-select" id="priorityFilter">
                        <option value="">All Priorities</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>
                <button class="btn btn-outline-secondary w-100" id="applyFilters">Apply Filters</button>
            </div>
        </div>
    </div>
    <div class="col-md-8">
        <div id="taskList">
            {% for task in tasks %}
            <div class="card mb-3 task-card {% if task.is_completed %}completed{% endif %}">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div class="form-check">
                        <input class="form-check-input task-checkbox" type="checkbox" 
                               data-task-id="{{ task.id }}" 
                               {% if task.is_completed %}checked{% endif %}>
                        <label class="form-check-label">
                            <h5 class="mb-1 {% if task.is_completed %}text-muted{% endif %}">
                                {{ task.title }}
                                {% if task.category_ref %}
                                <span class="badge bg-secondary">{{ task.category_ref.name }}</span>
                                {% endif %}
                                <span class="badge {% if task.priority == 'High' %}bg-danger{% elif task.priority == 'Medium' %}bg-warning text-dark{% else %}bg-primary{% endif %}">
                                    {{ task.priority }}
                                </span>
                            </h5>
                            {% if task.description %}
                            <p class="mb-1 {% if task.is_completed %}text-muted{% endif %}">{{ task.description }}</p>
                            {% endif %}
                            <small class="text-muted">Due: {{ task.due_date.strftime('%b %d, %Y %I:%M %p') }}</small>
                        </label>
                    </div>
                    <div class="btn-group">
                        <a href="{{ url_for('edit_task', task_id=task.id) }}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form action="{{ url_for('delete_task', task_id=task.id) }}" method="POST" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-outline-danger" 
                                    onclick="return confirm('Are you sure you want to delete this task?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            {% else %}
            <div class="text-center py-5">
                <i class="bi bi-check-circle display-1 text-muted mb-3"></i>
                <h3>No tasks found</h3>
                <p>Click the 'New Task' button to get started!</p>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
$(document).ready(function() {
    // Toggle task completion
    $('.task-checkbox').change(function() {
        const taskId = $(this).data('task-id');
        const isCompleted = $(this).is(':checked');
        
        $.ajax({
            url: `/task/${taskId}/toggle`,
            method: 'POST',
            success: function(response) {
                const taskCard = $(`input[data-task-id="${taskId}"]`).closest('.task-card');
                if (response.is_completed) {
                    taskCard.addClass('completed');
                    taskCard.find('h5, p').addClass('text-muted');
                } else {
                    taskCard.removeClass('completed');
                    taskCard.find('h5, p').removeClass('text-muted');
                }
            }
        });
    });

    // Apply filters
    $('#applyFilters').click(function() {
        const status = $('#statusFilter').val();
        const priority = $('#priorityFilter').val();
        
        // Reload the page with filters
        let url = new URL(window.location.href.split('?')[0]);
        if (status !== 'all') url.searchParams.set('status', status);
        if (priority) url.searchParams.set('priority', priority);
        
        window.location.href = url.toString();
    });

    // Search functionality
    $('#searchForm').submit(function(e) {
        e.preventDefault();
        const searchTerm = $('#searchInput').val();
        // Reload the page with search term
        let url = new URL(window.location.href.split('?')[0]);
        if (searchTerm) {
            url.searchParams.set('search', searchTerm);
        }
        window.location.href = url.toString();
    });
});
</script>
{% endblock %}
